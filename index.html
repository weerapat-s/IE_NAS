<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IE NAS Monitoring | 68030271</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0f172a; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                <i class="fa-solid fa-server mr-2"></i>PRECISION 5810 MONITOR
            </h1>
            <p class="text-slate-400 text-sm mt-1">Student ID: <span class="text-blue-400 font-mono">68030271</span></p>
        </div>
        <div id="status-badge" class="px-4 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 text-xs">System Online</div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="glass-card p-6 rounded-3xl text-center">
            <p class="text-xs text-slate-500 uppercase mb-2">CPU Usage</p>
            <h2 id="cpu-val" class="text-5xl font-bold">0%</h2>
        </div>
        <div class="glass-card p-6 rounded-3xl text-center">
            <p class="text-xs text-slate-500 uppercase mb-2">Free Memory</p>
            <h2 id="mem-val" class="text-5xl font-bold">0%</h2>
        </div>
        <div class="glass-card p-6 rounded-3xl text-center">
            <p class="text-xs text-slate-500 uppercase mb-2">Uptime (Hr)</p>
            <h2 id="uptime-val" class="text-5xl font-bold">0.0</h2>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-8 glass-card rounded-3xl mb-10">
        <h3 class="text-xl font-bold mb-6 text-blue-400"><i class="fa-solid fa-camera mr-2"></i>NAS Photo Upload</h3>
        <div class="flex flex-col md:flex-row gap-4 items-center">
            <input type="file" id="photo-input" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-500/20 file:text-blue-400 cursor-pointer" accept="image/*">
            <button id="upload-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-10 py-2 rounded-full font-bold transition-all">Upload Photo</button>
        </div>
        <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0-Sr2BDm0MGVFoxzgF6T9bcPNfF1yCgU",
            authDomain: "ienas-cloud.firebaseapp.com",
            databaseURL: "https://ienas-cloud-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ienas-cloud",
            storageBucket: "ienas-cloud.firebasestorage.app",
            messagingSenderId: "815356084214",
            appId: "1:815356084214:web:64469dcc82dad071c851d7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // 📈 ดึงข้อมูล CPU/RAM
        onValue(ref(db, 'nas_status'), (snap) => {
            const data = snap.val();
            if(data) {
                document.getElementById('cpu-val').innerText = data.cpu_usage;
                document.getElementById('mem-val').innerText = data.free_mem;
                document.getElementById('uptime-val').innerText = data.uptime_hr;
            }
        });

        // 📸 ส่วนอัปโหลด ImgBB (ใส่ API Key ของคุณตรงนี้นะครับ!)
        const IMGBB_API_KEY = "ใส่_API_KEY_ของคุณที่นี่"; 
        const uploadBtn = document.getElementById('upload-btn');

        uploadBtn.onclick = async () => {
            const file = document.getElementById('photo-input').files[0];
            if (!file) return alert("เลือกรูปก่อนครับ!");
            uploadBtn.innerText = "Uploading...";
            const fd = new FormData(); fd.append("image", file);
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: fd });
                const json = await res.json();
                if (json.success) {
                    const img = `<div class="rounded-xl overflow-hidden border border-slate-700"><img src="${json.data.url}" class="w-full h-32 object-cover"></div>`;
                    document.getElementById('gallery').innerHTML = img + document.getElementById('gallery').innerHTML;
                }
            } catch (e) { alert("Error!"); }
            uploadBtn.innerText = "Upload Photo";
        };
    </script>
</body>
</html>
