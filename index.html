<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRECISION 5810 MONITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background-color: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; padding: 1.5rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-teal-400 tracking-wide">
            <i class="fas fa-server mr-2"></i>PRECISION 5810 MONITOR
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base">Student ID: 68030271 | KMITL Computer Tech</p>
        <div class="mt-3">
            <span class="px-3 py-1 bg-teal-900 text-teal-300 rounded-full text-xs border border-teal-500 font-semibold tracking-wider">
                NAS Online
            </span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-panel border-t-4 border-t-blue-500">
            <h3 class="text-xs text-gray-500 mb-2 font-bold tracking-wider">CPU USAGE</h3>
            <div class="text-4xl font-bold text-white mb-4">14.95%</div>
            <div class="w-full bg-slate-700 h-1.5 rounded-full"><div class="bg-blue-500 h-1.5 rounded-full" style="width: 15%"></div></div>
        </div>
        <div class="glass-panel border-t-4 border-t-green-500">
            <h3 class="text-xs text-gray-500 mb-2 font-bold tracking-wider">FREE MEMORY</h3>
            <div class="text-4xl font-bold text-white mb-4">83.97%</div>
            <div class="w-full bg-slate-700 h-1.5 rounded-full"><div class="bg-green-500 h-1.5 rounded-full" style="width: 84%"></div></div>
        </div>
        <div class="glass-panel border-t-4 border-t-yellow-500">
            <h3 class="text-xs text-gray-500 mb-2 font-bold tracking-wider">SYSTEM UPTIME (HR)</h3>
            <div class="text-4xl font-bold text-white mb-4">2.22</div>
            <div class="text-xs text-gray-600 italic">Precision Tower 5810 Status</div>
        </div>
    </div>

    <div class="glass-panel border border-slate-700">
        <div class="flex items-center mb-6">
            <div class="bg-blue-600 p-2 rounded text-white mr-3">
                <i class="fas fa-images"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Smart NAS Uploader</h2>
        </div>
        
        <div class="mb-5">
            <label class="block text-gray-400 text-sm font-bold mb-3">
                เลือกโฟลเดอร์ปลายทางใน NAS (เลือกได้มากกว่า 1 โฟลเดอร์):
            </label>
            <div id="folderContainer" class="flex flex-wrap gap-3 p-4 bg-slate-800 border border-slate-600 rounded-lg min-h-[60px]">
                <span class="text-gray-500 text-sm flex items-center">
                    <i class="fas fa-spinner fa-spin mr-2"></i> กำลังดึงข้อมูลโฟลเดอร์จาก NAS...
                </span>
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-lg p-2 md:p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
            
            <div class="flex items-center w-full gap-4">
                <button id="chooseBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full font-semibold transition text-sm whitespace-nowrap">
                    เลือกรูปภาพ
                </button>
                <span id="fileNameDisplay" class="text-gray-400 text-sm truncate flex-1">ยังไม่ได้เลือกไฟล์...</span>
            </div>
            
            <button id="uploadBtn" class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white px-8 py-2 rounded-full font-bold transition whitespace-nowrap">
                Upload to NAS
            </button>
        </div>

        <div id="statusText" class="mt-6 text-center text-sm text-blue-400 hidden font-bold">
            <i class="fas fa-spinner fa-spin mr-2"></i><span id="progressCount">กำลังเตรียมส่งรูป...</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Firebase Config ของโปรเจกต์
        const firebaseConfig = {
            apiKey: "AIzaSyA0-Sr2BDm0MGVFoxzgF6T9bcPNfF1yCgU",
            authDomain: "ienas-cloud.firebaseapp.com",
            databaseURL: "https://ienas-cloud-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ienas-cloud"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ดึง Element จาก HTML
        const folderContainer = document.getElementById('folderContainer');
        const fileInput = document.getElementById('photoInput');
        const chooseBtn = document.getElementById('chooseBtn');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusText = document.getElementById('statusText');
        const progressCount = document.getElementById('progressCount');

        // 🌟 1. รับข้อมูลรายชื่อโฟลเดอร์จาก NAS มาสร้างเป็น Checkbox
        onValue(ref(db, 'folderList'), (snapshot) => {
            let folders = snapshot.val(); 
            
            if (folders) {
                folderContainer.innerHTML = ''; // เคลียร์ของเก่า
                
                // แปลงข้อมูลให้เป็น Array เสมอ (ป้องกัน Error จาก Firebase)
                if (!Array.isArray(folders)) {
                    folders = Object.values(folders);
                }
                
                folders.forEach(folder => {
                    const label = document.createElement('label');
                    label.className = "flex items-center gap-2 bg-slate-700 px-4 py-2 rounded-md cursor-pointer hover:bg-slate-600 transition border border-slate-500 text-white text-sm select-none shadow-sm";
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = "checkbox";
                    checkbox.value = folder;
                    checkbox.className = "folder-checkbox w-4 h-4 text-blue-500 bg-slate-900 border-slate-600 rounded";
                    
                    // เลือกโฟลเดอร์ General ไว้ให้ก่อน
                    if(folder === 'General') checkbox.checked = true;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(` 📁 ${folder}`));
                    folderContainer.appendChild(label);
                });
            } else {
                folderContainer.innerHTML = '<span class="text-gray-500 text-sm">ไม่พบโฟลเดอร์ใน NAS หรือ NAS กำลังปิดอยู่</span>';
            }
        });

        // 🌟 2. จัดการปุ่มเลือกไฟล์
        chooseBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            const fileCount = fileInput.files.length;
            if (fileCount > 0) {
                fileNameDisplay.textContent = `เลือกแล้ว ${fileCount} ไฟล์ (พร้อมอัปโหลด)`;
            } else {
                fileNameDisplay.textContent = "ยังไม่ได้เลือกไฟล์...";
            }
        });

        // 🌟 3. จัดการตอนกดปุ่ม Upload
        uploadBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            const selectedFolders = Array.from(document.querySelectorAll('.folder-checkbox:checked')).map(cb => cb.value);
            
            if (files.length === 0) {
                alert("กรุณาเลือกรูปก่อนครับ!");
                return;
            }
            if (selectedFolders.length === 0) {
                alert("กรุณาติ๊กเลือกโฟลเดอร์ปลายทางอย่างน้อย 1 โฟลเดอร์ครับ!");
                return;
            }

            statusText.classList.remove('hidden');
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let successCount = 0;

            // วนลูปส่งทีละรูป
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressCount.textContent = `กำลังอัปโหลดรูปที่ ${i + 1}/${files.length} ...`;

                try {
                    const base64String = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });

                    const fileName = `upload_${Date.now()}_${file.name}`;
                    const newPhotoRef = push(ref(db, 'photos'));
                    
                    await set(newPhotoRef, {
                        fileName: fileName,
                        base64: base64String,
                        targetFolders: selectedFolders, // ส่งชื่อโฟลเดอร์ไปเป็น Array
                        timestamp: Date.now()
                    });
                    
                    successCount++;
                } catch (error) {
                    console.error("❌ Error ส่งรูป:", error);
                }
            }

            statusText.classList.add('hidden');
            uploadBtn.disabled = false;
            uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            if (successCount === files.length) {
                alert(`✅ ส่ง ${successCount} รูป ไปยังโฟลเดอร์ [${selectedFolders.join(', ')}] สำเร็จแล้วครับ!`);
                fileInput.value = "";
                fileNameDisplay.textContent = "ยังไม่ได้เลือกไฟล์...";
            }
        });
    </script>
</body>
</html>
