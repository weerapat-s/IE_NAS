<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRECISION 5810 MONITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background-color: #1e293b; border-radius: 0.75rem; border: 1px solid #334155; padding: 1.5rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-teal-400 tracking-wide">
            <i class="fas fa-server mr-2"></i>PRECISION 5810 MONITOR
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base">Student ID: 68030271 | KMITL Computer Tech</p>
    </div>

    <div class="glass-panel border border-slate-700">
        <div class="flex items-center mb-6">
            <div class="bg-blue-600 p-2 rounded text-white mr-3">
                <i class="fas fa-images"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Smart NAS Uploader</h2>
        </div>
        
        <div class="mb-4">
            <label class="block text-gray-400 text-sm font-bold mb-2" for="folderSelect">
                เลือกโฟลเดอร์ปลายทางใน NAS:
            </label>
            <select id="folderSelect" class="w-full md:w-1/3 bg-slate-700 border border-slate-600 text-white rounded p-2 focus:outline-none focus:border-blue-500">
                <option value="General">กำลังดึงข้อมูลจาก NAS...</option>
            </select>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-lg p-2 md:p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
            
            <div class="flex items-center w-full gap-4">
                <button id="chooseBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full font-semibold transition text-sm whitespace-nowrap">
                    เลือกรูปภาพ
                </button>
                <span id="fileNameDisplay" class="text-gray-400 text-sm truncate flex-1">ยังไม่ได้เลือกไฟล์...</span>
            </div>
            
            <button id="uploadBtn" class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white px-8 py-2 rounded-full font-bold transition whitespace-nowrap">
                Upload to NAS
            </button>
        </div>

        <div id="statusText" class="mt-6 text-center text-sm text-blue-400 hidden font-bold">
            <i class="fas fa-spinner fa-spin mr-2"></i><span id="progressCount">กำลังเตรียมส่งรูป...</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // Config ฐานข้อมูล
        const firebaseConfig = {
            apiKey: "AIzaSyA0-Sr2BDm0MGVFoxzgF6T9bcPNfF1yCgU",
            authDomain: "ienas-cloud.firebaseapp.com",
            databaseURL: "https://ienas-cloud-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ienas-cloud"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ดึง Element ต่างๆ ในหน้าเว็บ
        const fileInput = document.getElementById('photoInput');
        const chooseBtn = document.getElementById('chooseBtn');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusText = document.getElementById('statusText');
        const progressCount = document.getElementById('progressCount');
        const folderSelect = document.getElementById('folderSelect');

        // ==========================================
        // 🌟 ฟีเจอร์: ดึงรายชื่อโฟลเดอร์จาก NAS มาแสดง
        // ==========================================
        onValue(ref(db, 'folderList'), (snapshot) => {
            const folders = snapshot.val(); 
            
            if (folders && Array.isArray(folders)) {
                folderSelect.innerHTML = ''; 
                folders.forEach(folder => {
                    const option = document.createElement('option');
                    option.value = folder;
                    option.textContent = `📁 ${folder}`;
                    folderSelect.appendChild(option);
                });
            } else {
                folderSelect.innerHTML = '<option value="General">📂 General</option>';
            }
        });

        // ==========================================
        // 🌟 ฟีเจอร์: จัดการการเลือกรูปภาพ
        // ==========================================
        chooseBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            const fileCount = fileInput.files.length;
            if (fileCount > 0) {
                fileNameDisplay.textContent = `เลือกแล้ว ${fileCount} ไฟล์ (เตรียมลงโฟลเดอร์ ${folderSelect.value})`;
            } else {
                fileNameDisplay.textContent = "ยังไม่ได้เลือกไฟล์...";
            }
        });

        folderSelect.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = `เลือกแล้ว ${fileInput.files.length} ไฟล์ (เตรียมลงโฟลเดอร์ ${folderSelect.value})`;
            }
        });

        // ==========================================
        // 🌟 ฟีเจอร์: อัปโหลดรูปภาพทีละหลายรูป
        // ==========================================
        uploadBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            const targetFolder = folderSelect.value;
            
            if (files.length === 0) {
                alert("กรุณาเลือกรูปก่อนครับ!");
                return;
            }

            statusText.classList.remove('hidden');
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50');

            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressCount.textContent = `กำลังอัปโหลดรูปที่ ${i + 1} จาก ${files.length}...`;

                try {
                    const base64String = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });

                    const fileName = `upload_${Date.now()}_${file.name}`;
                    const newPhotoRef = push(ref(db, 'photos'));
                    
                    await set(newPhotoRef, {
                        fileName: fileName,
                        base64: base64String,
                        folderName: targetFolder, 
                        timestamp: Date.now()
                    });
                    
                    successCount++;
                } catch (error) {
                    console.error("❌ Error ส่งรูปที่", i+1, error);
                }
            }

            statusText.classList.add('hidden');
            uploadBtn.disabled = false;
            uploadBtn.classList.remove('opacity-50');
            
            if (successCount === files.length) {
                alert(`✅ อัปโหลดสำเร็จทั้ง ${successCount} รูป! กำลังส่งเข้า NAS โฟลเดอร์ ${targetFolder}`);
                fileInput.value = "";
                fileNameDisplay.textContent = "ยังไม่ได้เลือกไฟล์...";
            } else {
                alert(`⚠️ อัปโหลดสำเร็จ ${successCount}/${files.length} รูป (เช็คอินเทอร์เน็ต)`);
            }
        });
    </script>
</body>
</html>
