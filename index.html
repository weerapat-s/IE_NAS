<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IE NAS Monitoring | 68030271</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0f172a; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
        <div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                <i class="fa-solid fa-server mr-2"></i>PRECISION 5810 MONITOR
            </h1>
            <p class="text-slate-400 text-sm mt-1">System Status for Student ID: <span class="text-blue-400 font-mono">68030271</span></p>
        </div>
        <div id="status-badge" class="px-4 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/50 text-xs animate-pulse">
            Connecting to Cloud...
        </div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="glass-card p-6 rounded-3xl">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-blue-500/20 rounded-2xl text-blue-400"><i class="fa-solid fa-microchip text-2xl"></i></div>
                <span class="text-xs text-slate-500 uppercase">CPU Usage</span>
            </div>
            <h2 id="cpu-val" class="text-5xl font-bold mb-2">0%</h2>
            <div class="w-full bg-slate-700 rounded-full h-1.5">
                <div id="cpu-bar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="glass-card p-6 rounded-3xl">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-emerald-500/20 rounded-2xl text-emerald-400"><i class="fa-solid fa-memory text-2xl"></i></div>
                <span class="text-xs text-slate-500 uppercase">Free Memory</span>
            </div>
            <h2 id="mem-val" class="text-5xl font-bold mb-2">0%</h2>
            <div class="w-full bg-slate-700 rounded-full h-1.5">
                <div id="mem-bar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="glass-card p-6 rounded-3xl">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-amber-500/20 rounded-2xl text-amber-400"><i class="fa-solid fa-clock-rotate-left text-2xl"></i></div>
                <span class="text-xs text-slate-500 uppercase">System Uptime</span>
            </div>
            <h2 id="uptime-val" class="text-5xl font-bold mb-2">0.00</h2>
            <p class="text-slate-400 text-sm">Hours online</p>
        </div>

    </div>

    <div class="max-w-6xl mx-auto mt-10 p-6 glass-card rounded-3xl flex flex-col md:flex-row justify-between gap-4 items-center">
        <div class="flex items-center gap-4">
            <div class="text-left">
                <p class="text-xs text-slate-500 uppercase">Last Sync Time</p>
                <p id="update-val" class="text-sm font-mono text-slate-300">--/--/---- --:--:--</p>
            </div>
        </div>
        <div class="text-right text-xs text-slate-500 italic">
            Developed by Weerapat Uamkasem | KMITL Computer Tech
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ✅ ข้อมูล Config ของคุณถูกใส่ไว้ตรงนี้แล้วครับ
        const firebaseConfig = {
            apiKey: "AIzaSyA0-Sr2BDm0MGVFoxzgF6T9bcPNfF1yCgU",
            authDomain: "ienas-cloud.firebaseapp.com",
            databaseURL: "https://ienas-cloud-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ienas-cloud",
            storageBucket: "ienas-cloud.firebasestorage.app",
            messagingSenderId: "815356084214",
            appId: "1:815356084214:web:64469dcc82dad071c851d7",
            measurementId: "G-1ZM43S94QQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'nas_status');

        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('cpu-val').innerText = data.cpu_usage;
                document.getElementById('cpu-bar').style.width = data.cpu_usage;
                
                document.getElementById('mem-val').innerText = data.free_mem;
                document.getElementById('mem-bar').style.width = data.free_mem;
                
                document.getElementById('uptime-val').innerText = data.uptime_hr;
                document.getElementById('update-val').innerText = data.last_update;

                const badge = document.getElementById('status-badge');
                badge.innerText = "System Online";
                badge.classList.remove('bg-red-500/20', 'text-red-400', 'border-red-500/50', 'animate-pulse');
                badge.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');
            }
        });
    </script>
</body>
</html>
