<script type="module">
  // นำเข้า Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  // Config ของโปรเจกต์คุณวีระภัทร
  const firebaseConfig = {
    apiKey: "AIzaSyA0-Sr2BDm0MGVFoxzgF6T9bcPNfF1yCgU",
    authDomain: "ienas-cloud.firebaseapp.com",
    databaseURL: "https://ienas-cloud-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ienas-cloud"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ฟังก์ชันอัปโหลด (ผูกกับปุ่ม Upload to NAS ของคุณ)
  window.uploadToNAS = function() {
    // ดึงไฟล์จาก Input (แก้ไอดีให้ตรงกับ input ของคุณ ถ้าไม่ใช่ photoInput)
    const fileInput = document.getElementById('photoInput'); // ⚠️ เช็ค ID ตรงนี้ให้ตรงกับในเว็บคุณนะครับ
    const file = fileInput.files[0];
    
    if (!file) {
        alert("กรุณาเลือกรูปก่อนครับ!");
        return;
    }

    // เปลี่ยนข้อความปุ่ม หรือแสดงสถานะว่ากำลังโหลด
    console.log("⏳ กำลังแปลงรูปภาพเป็นโค้ด Base64...");
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64String = e.target.result; 
        const fileName = `upload_${Date.now()}_${file.name}`;

        try {
            console.log("☁️ กำลังส่งข้อมูลเข้า Firebase Realtime Database...");
            const newPhotoRef = push(ref(db, 'photos'));
            
            // โยนเข้า Firebase ตรงๆ
            await set(newPhotoRef, {
                fileName: fileName,
                base64: base64String,
                timestamp: Date.now()
            });
            
            alert("✅ อัปโหลดสำเร็จ! NAS กำลังดูดรูปลงเครื่องครับ");
            
        } catch (error) {
            console.error("❌ Error ตอนส่งเข้า Firebase:", error);
            alert("อัปโหลดไม่สำเร็จ เช็ค Permission ของ Database ครับ");
        }
    };
    
    // เริ่มอ่านไฟล์
    reader.readAsDataURL(file);
  }
</script>
